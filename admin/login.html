<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Asenso Bago Health Services</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-login-page">
  
  <!-- Admin Login Container -->
  <div class="admin-login-container">
    
    <!-- Login Card -->
    <div class="admin-login-card">
      
      <!-- Logo & Title -->
      <div class="admin-login-header">
        <img src="../assets/images/bago-city-logo.png" alt="Bago City Logo" class="admin-logo">
        <h1 class="admin-login-title">Admin Portal</h1>
        <p class="admin-login-subtitle">Health Services Request Management</p>
      </div>
      
      <!-- Error Message -->
      <div id="login-error" class="error-message"></div>
      
      <!-- Login Form -->
      <form id="admin-login-form" class="admin-login-form">
        
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-with-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="admin@bagocity.gov.ph"
              required
              autocomplete="email"
            >
          </div>
        </div>
        
        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-with-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" id="login-btn" class="btn-primary btn-block">
          <span id="login-text">Sign In</span>
          <svg id="login-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
        
      </form>
      
      <!-- Footer -->
      <div class="admin-login-footer">
        <p>City of Bago, Negros Occidental</p>
        <p class="text-tertiary">Asenso Bago Admin System</p>
      </div>
      
    </div>
    
  </div>
  
  <!-- Scripts -->
  <script src="../assets/js/supabase-config.js"></script>
  <script src="admin-auth.js"></script>
  
</body>
</html>
