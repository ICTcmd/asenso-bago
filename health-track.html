<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A2E5C" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <title>Track Request — Asenso Bago</title>
  <style>
    .track-page {
      min-height: 100vh;
      background: #f9fafb;
      padding-bottom: 80px;
    }

    .track-header {
      background: #0A2E5C;
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .track-header-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .track-header h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      flex: 1;
    }

    .track-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .search-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .search-label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
      display: block;
    }

    .search-input-group {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }

    .search-input:focus {
      outline: none;
      border-color: #0A2E5C;
    }

    .search-btn {
      padding: 14px 24px;
      background: #0A2E5C;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .recent-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .recent-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-item {
      padding: 8px 12px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      transition: all 0.2s;
    }

    .recent-item:hover {
      background: #0A2E5C;
      color: white;
      border-color: #0A2E5C;
    }

    .result-section {
      display: none;
    }

    .result-section.active {
      display: block;
    }

    .result-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .program-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-hw {
      background: rgba(192,57,43,0.12);
      color: #c0392b;
    }

    .badge-wol {
      background: rgba(224,92,0,0.12);
      color: #e05c00;
    }

    .badge-sbb {
      background: rgba(0,119,182,0.12);
      color: #0077b6;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .status-scheduled {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }

    .result-info {
      margin-top: 20px;
    }

    .info-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 14px;
      color: #6b7280;
      font-weight: 600;
      width: 120px;
      flex-shrink: 0;
    }

    .info-value {
      font-size: 14px;
      color: #1f2937;
      font-weight: 500;
      flex: 1;
    }

    .error-message {
      background: #fef2f2;
      border: 2px solid #fecaca;
      color: #991b1b;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .error-message.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top-color: #0A2E5C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="track-page">
    <!-- Header -->
    <header class="track-header">
      <div class="track-header-content">
        <button class="back-btn" onclick="window.history.back()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1>Track Request</h1>
      </div>
    </header>

    <!-- Main Container -->
    <div class="track-container">
      <!-- Search Section -->
      <div class="search-section">
        <label class="search-label">Enter Your Reference Number</label>
        <div class="search-input-group">
          <input 
            type="text" 
            class="search-input" 
            id="search-input"
            placeholder="HW-2026-00001"
            maxlength="20"
          >
          <button class="search-btn" id="search-btn" onclick="trackRequest()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            Track
          </button>
        </div>

        <!-- Recent Searches -->
        <div class="recent-section" id="recent-section" style="display:none">
          <div class="recent-title">Recent Searches</div>
          <div class="recent-list" id="recent-list"></div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-message"></div>

      <!-- Loading State -->
      <div id="loading" class="loading" style="display:none">
        <div class="loading-spinner"></div>
        <p style="margin-top:16px">Searching...</p>
      </div>

      <!-- Result Section -->
      <div id="result-section" class="result-section">
        <div class="result-card">
          <div class="result-header">
            <div class="program-badge" id="program-badge">Program</div>
            <div class="status-badge" id="status-badge">Status</div>
          </div>
          
          <div class="result-info">
            <div class="info-row">
              <div class="info-label">Reference</div>
              <div class="info-value" id="ref-value">-</div>
            </div>
            <div class="info-row">
              <div class="info-label">Name</div>
              <div class="info-value" id="name-value">-</div>
            </div>
            <div class="info-row">
              <div class="info-label">Barangay</div>
              <div class="info-value" id="barangay-value">-</div>
            </div>
            <div class="info-row">
              <div class="info-label">Submitted</div>
              <div class="info-value" id="date-value">-</div>
            </div>
            <div class="info-row" id="scheduled-row" style="display:none">
              <div class="info-label">Scheduled</div>
              <div class="info-value" id="scheduled-value">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const { url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY } = window.SUPABASE_CONFIG || {};
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load recent searches on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadRecentSearches();
      
      // Allow Enter key to search
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') trackRequest();
      });
    });

    function loadRecentSearches() {
      const recent = JSON.parse(localStorage.getItem('healthServiceRefs') || '[]');
      if (recent.length > 0) {
        document.getElementById('recent-section').style.display = 'block';
        const list = document.getElementById('recent-list');
        list.innerHTML = recent.map(ref => 
          `<div class="recent-item" onclick="searchRecent('${ref}')">${ref}</div>`
        ).join('');
      }
    }

    function searchRecent(refNumber) {
      document.getElementById('search-input').value = refNumber;
      trackRequest();
    }

    async function trackRequest() {
      const refNumber = document.getElementById('search-input').value.trim().toUpperCase();
      
      if (!refNumber) {
        showError('Please enter a reference number');
        return;
      }

      // Hide previous results/errors
      hideAll();
      
      // Show loading
      document.getElementById('loading').style.display = 'block';
      document.getElementById('search-btn').disabled = true;

      try {
        const { data, error } = await supabaseClient
          .from('health_service_requests')
          .select('*')
          .eq('reference_number', refNumber)
          .single();

        if (error) throw error;

        if (data) {
          displayResult(data);
        } else {
          showError('Request not found. Please check your reference number.');
        }

      } catch (error) {
        console.error('Error tracking request:', error);
        showError('Request not found or invalid reference number.');
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('search-btn').disabled = false;
      }
    }

    function displayResult(data) {
      // Show result section
      document.getElementById('result-section').classList.add('active');

      // Program badge
      const programNames = {
        'heart_warriors': 'Heart Warriors',
        'wheels_of_love': 'Wheels of Love',
        'smile_bright': 'Smile Bright'
      };
      const programBadge = document.getElementById('program-badge');
      programBadge.textContent = programNames[data.program] || data.program;
      programBadge.className = 'program-badge badge-' + data.program.split('_')[0];

      // Status badge
      const statusBadge = document.getElementById('status-badge');
      statusBadge.textContent = data.status.replace('_', ' ');
      statusBadge.className = 'status-badge status-' + data.status;

      // Info values
      document.getElementById('ref-value').textContent = data.reference_number;
      document.getElementById('name-value').textContent = data.full_name;
      document.getElementById('barangay-value').textContent = data.barangay;
      document.getElementById('date-value').textContent = formatDate(data.created_at);

      // Scheduled date (if applicable)
      if (data.scheduled_date) {
        document.getElementById('scheduled-row').style.display = 'flex';
        document.getElementById('scheduled-value').textContent = formatDate(data.scheduled_date);
      } else {
        document.getElementById('scheduled-row').style.display = 'none';
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('active');
      document.getElementById('result-section').classList.remove('active');
    }

    function hideAll() {
      document.getElementById('error-message').classList.remove('active');
      document.getElementById('result-section').classList.remove('active');
    }
  </script>
</body>
</html>
