<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0A2E5C">
<title>Bago City Explorer — Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root {
  --navy: #0A2E5C;
  --navy-dark: #081f3d;
  --gold: #C9A227;
  --orange: #F28C28;
  --white: #FFFFFF;
  --bg-light: #F4F6F9;
  --text-primary: #172033;
  --text-secondary: #64748B;
  --font-heading: 'Montserrat', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: var(--font-body); }

#map { position: fixed; inset: 0; z-index: 0; }

/* Header */
.hdr {
  background: linear-gradient(135deg, var(--navy) 0%, #0d3a73 100%);
  padding: max(12px, env(safe-area-inset-top)) 14px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  box-shadow: 0 4px 24px rgba(10, 46, 92, 0.35);
}

.bk {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: all 0.2s;
  min-width: 44px;
  min-height: 44px;
}

.bk:hover { background: rgba(255, 255, 255, 0.25); }
.bk:active { transform: scale(0.92); }

.hi { flex: 1; }
.hi h1 {
  font-size: 16px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.3px;
  font-family: var(--font-heading);
}
.hi p {
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 2px;
  font-family: var(--font-body);
}

.hdr img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(201, 162, 39, 0.6);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.hdr-badge {
  background: linear-gradient(135deg, rgba(201, 162, 39, 0.25), rgba(242, 140, 40, 0.25));
  backdrop-filter: blur(8px);
  border: 1px solid rgba(201, 162, 39, 0.4);
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.95);
  white-space: nowrap;
  font-family: var(--font-heading);
}

/* Legend */
.legend {
  position: absolute;
  bottom: 20px;
  left: 14px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 12px 14px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid rgba(10, 46, 92, 0.08);
  font-family: var(--font-body);
}

.legend-title {
  font-size: 11px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 8px;
  font-family: var(--font-heading);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.legend-row:last-child { margin-bottom: 0; }

.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid var(--white);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

/* Stats overlay */
.stats-overlay {
  position: absolute;
  top: max(72px, calc(env(safe-area-inset-top) + 72px));
  right: 14px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(10, 46, 92, 0.08);
}

.stats-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  font-family: var(--font-body);
}

.stats-value {
  font-size: 24px;
  font-weight: 900;
  color: var(--navy);
  font-family: var(--font-heading);
}

/* Custom marker styles */
.custom-marker {
  background: transparent;
  border: none;
}

/* Leaflet popup customization */
.leaflet-popup-content-wrapper {
  border-radius: 16px;
  padding: 0;
  font-family: var(--font-body);
}

.leaflet-popup-content {
  margin: 0;
  min-width: 220px;
}

.popup-content {
  padding: 14px;
}

.popup-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.popup-icon {
  font-size: 24px;
}

.popup-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--text-primary);
  font-family: var(--font-heading);
  line-height: 1.2;
}

.popup-category {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  margin-bottom: 8px;
  font-family: var(--font-heading);
}

.popup-category.star { background: linear-gradient(135deg, var(--orange), var(--gold)); color: white; }
.popup-category.heritage { background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; }
.popup-category.barangay { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; }
.popup-category.city { background: linear-gradient(135deg, var(--navy), #0d3a73); color: white; }

.popup-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}

.popup-link {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0369a1, #0ea5e9);
  color: white;
  text-decoration: none;
  font-family: var(--font-heading);
  transition: all 0.2s;
}

.popup-link:hover {
  background: linear-gradient(135deg, #0284c7, #06b6d4);
  transform: translateY(-1px);
}

/* Cluster styles */
.marker-cluster {
  background: transparent !important;
}

.marker-cluster div {
  background: transparent !important;
}

/* Loading */
#loading {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, #0d3a73 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  transition: opacity 0.6s;
}

#loading.done {
  opacity: 0;
  pointer-events: none;
}

#loading img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  animation: pulse 1.4s ease-in-out infinite;
  box-shadow: 0 0 40px rgba(201, 162, 39, 0.6);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

#loading h2 {
  font-size: 20px;
  font-weight: 900;
  color: var(--white);
  margin-top: 20px;
  font-family: var(--font-heading);
}

#loading p {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.65);
  margin-top: 8px;
  font-family: var(--font-body);
}
</style>
</head>
<body>

<div id="loading">
  <img src="assets/images/bago-city-logo.png" alt="Bago City Logo">
  <h2>Bago City Explorer</h2>
  <p>Loading interactive map...</p>
</div>

<div id="map"></div>

<div class="hdr">
  <a href="javascript:history.back()" class="bk" aria-label="Go back">&#8592;</a>
  <div class="hi">
    <h1>Bago City Explorer</h1>
    <p>Interactive map of Bago City</p>
  </div>
  <span class="hdr-badge" id="spot-count">45 locations</span>
  <img src="assets/images/bago-city-logo.png" alt="Bago City">
</div>

<div class="legend">
  <div class="legend-title">Map Legend</div>
  <div class="legend-row">
    <span class="legend-dot" style="background: linear-gradient(135deg, var(--orange), var(--gold))"></span>
    <span>Tourist Attractions</span>
  </div>
  <div class="legend-row">
    <span class="legend-dot" style="background: linear-gradient(135deg, #8e44ad, #9b59b6)"></span>
    <span>Heritage Sites</span>
  </div>
  <div class="legend-row">
    <span class="legend-dot" style="background: linear-gradient(135deg, #27ae60, #2ecc71)"></span>
    <span>Barangays</span>
  </div>
  <div class="legend-row">
    <span class="legend-dot" style="background: linear-gradient(135deg, var(--navy), #0d3a73)"></span>
    <span>City Services</span>
  </div>
</div>

<div class="stats-overlay">
  <div class="stats-label">Total Locations</div>
  <div class="stats-value" id="total-count">45</div>
</div>

<script>
// Initialize map centered on Bago City
const map = L.map('map', {
  center: [10.5380, 122.8424],
  zoom: 13,
  zoomControl: true,
  minZoom: 11,
  maxZoom: 18
});

// Add OpenStreetMap tiles with proper configuration
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
  crossOrigin: true
}).addTo(map);

// Barangays data with verified coordinates
const BARANGAYS = [
  {"num":"01","name":"Abuanan","type":"u","lng":122.98420025684727,"lat":10.528539819452122,"desc":"An urban barangay in the northeast known for quarries and rice mills.","pop":"5,700"},
  {"num":"02","name":"Alianza","type":"r","lng":122.92403948142989,"lat":10.471727207865271,"desc":"A rural barangay known for agricultural lands and rice production.","pop":"3,211"},
  {"num":"03","name":"Atipuluan","type":"u","lng":122.94960955731095,"lat":10.510806037719178,"desc":"An urban barangay along the main Negros South Road — key commercial hub.","pop":"4,269"},
  {"num":"04","name":"Bacong-Montilla","type":"r","lng":123.04456895242693,"lat":10.52549974342964,"desc":"Largest barangay by land area. Vast agricultural and forest lands bordering Murcia.","pop":"7,844"},
  {"num":"05","name":"Bagroy","type":"r","lng":122.87897208420888,"lat":10.477054001912508,"desc":"Smallest population. Coastal barangay along the Guimaras Strait.","pop":"1,694"},
  {"num":"06","name":"Balingasag","type":"u","lng":122.8439774832295,"lat":10.532617670284175,"desc":"An urban barangay with commercial establishments near the city center.","pop":"4,498"},
  {"num":"07","name":"Binubuhan","type":"r","lng":123.00710623904017,"lat":10.45741223258939,"desc":"A rural barangay in Cluster 8 with Ma-ao and Mailum.","pop":"5,581"},
  {"num":"08","name":"Busay","type":"t","lng":122.89328014830807,"lat":10.537861484006031,"desc":"A rural barangay with scenic mountain views toward Mt. Kanlaon.","pop":"6,896"},
  {"num":"09","name":"Calumangan","type":"r","lng":122.88553878137543,"lat":10.566696921406646,"desc":"A rural barangay known for rice mills and the Bago River watershed.","pop":"7,979"},
  {"num":"10","name":"Caridad","type":"u","lng":122.89319749672026,"lat":10.490554449294747,"desc":"An urban barangay forming part of the Bago City urban core.","pop":"4,901"},
  {"num":"11","name":"Don Jorge L. Araneta","type":"u","lng":122.94927723098942,"lat":10.461494579318394,"desc":"Named after Gen. Juan A. Araneta who led the 1898 revolution.","pop":"9,457"},
  {"num":"12","name":"Dulao","type":"r","lng":122.96005550957621,"lat":10.558628722037081,"desc":"A rural barangay traversed by the Bago River with fertile agricultural land.","pop":"10,111"},
  {"num":"13","name":"Ilijan","type":"t","lng":123.0456139219644,"lat":10.448583848724228,"desc":"Farthest barangay (36.99 km). President Quezon stayed here in 1942.","pop":"5,581"},
  {"num":"14","name":"Lag-Asan","type":"r","lng":122.84523382739843,"lat":10.520407762342293,"desc":"A rural barangay south of Poblacion with the Hundred Hills Nature Resort.","pop":"11,794"},
  {"num":"15","name":"Ma-ao","type":"t","lng":122.99228504093716,"lat":10.48782819895985,"desc":"Most populated barangay. Home to the historic Ma-ao Sugar Central.","pop":"14,916"},
  {"num":"16","name":"Mailum","type":"t","lng":123.05063481981637,"lat":10.469546480669388,"desc":"Prime ecotourism destination at the foot of Mt. Kanlaon.","pop":"8,844"},
  {"num":"17","name":"Malingin","type":"r","lng":122.92411341066767,"lat":10.51149786259714,"desc":"A rural barangay known for rice mills and farming communities.","pop":"6,649"},
  {"num":"18","name":"Napoles","type":"r","lng":122.89317526285295,"lat":10.517984329175057,"desc":"A rural barangay known for rice mills and rice fields.","pop":"6,564"},
  {"num":"19","name":"Pacol","type":"r","lng":122.85895949332998,"lat":10.50141113020345,"desc":"A rural barangay near the city center along the coastal area.","pop":"3,999"},
  {"num":"20","name":"Poblacion","type":"t","lng":122.83383286118658,"lat":10.53607977456109,"desc":"Main downtown - seat of local government. Smallest land area.","pop":"11,794"},
  {"num":"21","name":"Sagasa","type":"r","lng":122.89424548085672,"lat":10.468489883021228,"desc":"A coastal rural barangay along the Guimaras Strait known for fishing.","pop":"—"},
  {"num":"22","name":"Sampinit","type":"r","lng":122.8566256071049,"lat":10.53815983453155,"desc":"A rural barangay east of the city center bordering Mt. Kanlaon Natural Park.","pop":"6,856"},
  {"num":"23","name":"Tabunan","type":"r","lng":122.93794694969182,"lat":10.570686757182422,"desc":"A rural barangay in the north with mangrove forests and rice fields.","pop":"—"},
  {"num":"24","name":"Taloc","type":"u","lng":122.90992379594812,"lat":10.57849107881266,"desc":"An urban barangay in the northwest bordering Bacolod City.","pop":"—"}
];

// Tourist spots and attractions with verified coordinates
const SPOTS = [
  {name:"Pataan Mountain Resort",icon:"🏔",tier:"star",lng:123.09226372370247,lat:10.482019585201646,desc:"Mountain getaway near Kanlaon Volcano with cool breeze and panoramic views."},
  {name:"Tinago Falls",icon:"💧",tier:"star",lng:123.09342702555657,lat:10.4761328896147,desc:"Stunning twin waterfalls reached via 220 scenic steps through lush forest."},
  {name:"Gianna's Mountain Resort",icon:"🏔",tier:"star",lng:123.1032204120654,lat:10.483586883522356,desc:"Mountain resort with cool breeze and panoramic views."},
  {name:"Bala-an Hills",icon:"⛰",tier:"star",lng:123.10303538322917,lat:10.480235988219139,desc:"Scenic hills offering panoramic views. A nature destination for hikers."},
  {name:"Bungyod Agri Tourism Park",icon:"🌿",tier:"star",lng:123.09050410258965,lat:10.479096601860814,desc:"Agricultural tourism park showcasing local farming practices."},
  {name:"Mailum Organic Village (MOVA)",icon:"🌱",tier:"star",lng:123.0706571745684,lat:10.485367357044765,desc:"Organic farming village promoting sustainable agriculture."},
  {name:"Torresta Infinity Farm",icon:"🚜",tier:"star",lng:123.07386894960827,lat:10.484125388280878,desc:"Infinity farm with scenic agricultural landscapes."},
  {name:"Kipot Summer Resort",icon:"🏖",tier:"star",lng:123.06982716530145,lat:10.477862241175968,desc:"Popular summer resort near Kipot Twin Falls."},
  {name:"Maragandang Falls",icon:"💧",tier:"star",lng:123.0780370395538,lat:10.463099875402742,desc:"Beautiful waterfall in the Mailum area."},
  {name:"Buenos Aires Mountain Resort",icon:"⛰",tier:"star",lng:123.04815740062239,lat:10.457006377209883,desc:"Scenic mountain resort with breathtaking views of Negros."},
  {name:"Ma-ao Sugar Central Public Market",icon:"🏪",tier:"city",lng:122.95384952618106,lat:10.475143262674598,desc:"Public market at the historic Ma-ao Sugar Central area."},
  {name:"Buen Tierra Beach House",icon:"🏖",tier:"star",lng:122.85207210955127,lat:10.547386523769433,desc:"Beach house resort along the coast."},
  {name:"Nana's Place",icon:"🏡",tier:"star",lng:122.84816255825815,lat:10.543035756438785,desc:"Cozy resort retreat."},
  {name:"Bago Public Market",icon:"🏪",tier:"city",lng:122.83799043389978,lat:10.53936818360094,desc:"Main public market of Bago City."},
  {name:"Manuel Y. Torres Memorial Coliseum",icon:"🏟",tier:"heritage",lng:122.83501322677576,lat:10.537226158958923,desc:"Major cultural and events venue in Bago City."},
  {name:"Saint John the Baptist Parish",icon:"⛪",tier:"heritage",lng:122.83453506928456,lat:10.537283811975193,desc:"Spanish-colonial cathedral dedicated to Saint John the Baptist."},
  {name:"Balay ni Tan Juan",icon:"🏡",tier:"heritage",lng:122.83477865897227,lat:10.534489844937438,desc:"Well-preserved ancestral house showcasing cultural heritage."},
  {name:"Javellana Mansion",icon:"🏰",tier:"heritage",lng:122.83605744838584,lat:10.536859752555511,desc:"Built in 1920 on a 440-ha sugar plantation. Also known as Balay Daku."},
  {name:"Bantayan Park",icon:"🌳",tier:"star",lng:122.83162155649741,lat:10.537627445468019,desc:"Historic park — site of the November 5, 1898 revolution."},
  {name:"Ma-ao Public Plaza",icon:"🏛️",tier:"city",lng:122.99161502666759,lat:10.489965324482274,desc:"Public plaza in the Ma-ao area."},
  {name:"Bago City Hall",icon:"🏛️",tier:"city",lng:122.83512455511269,lat:10.53815531116121,desc:"Seat of the local government of Bago City."}
];

// Create custom marker icon
function createCustomIcon(tier, icon) {
  let color;
  switch(tier) {
    case 'star': color = '#F28C28'; break;
    case 'heritage': color = '#8e44ad'; break;
    case 'city': color = '#0A2E5C'; break;
    default: color = '#27ae60';
  }
  
  return L.divIcon({
    className: 'custom-marker',
    html: `
      <div style="
        background-color: ${color};
        width: 32px;
        height: 32px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 3px solid white;
        box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      ">
        <div style="
          transform: rotate(45deg);
          text-align: center;
          line-height: 26px;
          font-size: 14px;
        ">${icon}</div>
      </div>
    `,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -32]
  });
}

// Create cluster custom icon
function createClusterIcon(cluster) {
  const count = cluster.getChildCount();
  let size = 'small';
  if (count > 10) size = 'medium';
  if (count > 20) size = 'large';
  
  return L.divIcon({
    html: `
      <div style="
        background: linear-gradient(135deg, var(--navy), #0d3a73);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border: 3px solid white;
        box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      ">${count}</div>
    `,
    className: 'marker-cluster-custom',
    iconSize: L.point(40, 40, true)
  });
}

// Create marker cluster group
const markers = L.markerClusterGroup({
  iconCreateFunction: createClusterIcon,
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true
});

// Add barangays
BARANGAYS.forEach(brgy => {
  const marker = L.marker([brgy.lat, brgy.lng], {
    icon: createCustomIcon('barangay', '📍')
  });
  
  const popupContent = `
    <div class="popup-content">
      <div class="popup-header">
        <span class="popup-icon">📍</span>
        <span class="popup-title">${brgy.name}</span>
      </div>
      <span class="popup-category barangay">Barangay ${brgy.num}</span>
      <div class="popup-desc">${brgy.desc}</div>
      <div class="popup-desc" style="font-weight: 600;">Population: ${brgy.pop}</div>
      <a href="https://www.google.com/maps?q=${brgy.lat},${brgy.lng}" target="_blank" class="popup-link">
        📍 View on Google Maps
      </a>
    </div>
  `;
  
  marker.bindPopup(popupContent, { maxWidth: 300 });
  markers.addLayer(marker);
});

// Add tourist spots
SPOTS.forEach(spot => {
  const marker = L.marker([spot.lat, spot.lng], {
    icon: createCustomIcon(spot.tier, spot.icon)
  });
  
  const popupContent = `
    <div class="popup-content">
      <div class="popup-header">
        <span class="popup-icon">${spot.icon}</span>
        <span class="popup-title">${spot.name}</span>
      </div>
      <span class="popup-category ${spot.tier}">${spot.tier === 'star' ? 'Tourist Attraction' : spot.tier === 'heritage' ? 'Heritage Site' : 'City Service'}</span>
      <div class="popup-desc">${spot.desc}</div>
      <a href="https://www.google.com/maps?q=${spot.lat},${spot.lng}" target="_blank" class="popup-link">
        📍 View on Google Maps
      </a>
    </div>
  `;
  
  marker.bindPopup(popupContent, { maxWidth: 300 });
  markers.addLayer(marker);
});

// Add markers to map
map.addLayer(markers);

// Update counts
document.getElementById('spot-count').textContent = `${BARANGAYS.length + SPOTS.length} locations`;
document.getElementById('total-count').textContent = BARANGAYS.length + SPOTS.length;

// Hide loading screen
setTimeout(() => {
  document.getElementById('loading').classList.add('done');
}, 1000);

// Fit map to show all markers
setTimeout(() => {
