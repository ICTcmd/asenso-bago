<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0A2E5C">
<title>Bago City Explorer — Interactive Map</title>
<link rel="preconnect" href="https://api.mapbox.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
/* ── Design Tokens ── */
:root {
  --navy: #0A2E5C;
  --navy-dark: #081f3d;
  --gold: #C9A227;
  --orange: #F28C28;
  --white: #FFFFFF;
  --bg-light: #F4F6F9;
  --text-primary: #172033;
  --text-secondary: #64748B;
  --text-tertiary: #94A3B8;
  --font-heading: 'Montserrat', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font-body)}
#map{position:fixed;inset:0}

/* ── Loader ── */
#ldr{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 50%,#0d3a73 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;transition:opacity .6s}
#ldr.done{opacity:0;pointer-events:none}
#ldr img{width:80px;height:80px;border-radius:50%;animation:lp 1.4s ease-in-out infinite;box-shadow:0 0 40px rgba(201,162,39,.6)}
@keyframes lp{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(5deg)}}
#ldr h2{font-size:20px;font-weight:900;color:var(--white);text-align:center;font-family:var(--font-heading)}
#ldr p{font-size:13px;color:rgba(255,255,255,.65);font-family:var(--font-body)}
.bw{width:200px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));animation:bfill 1.5s ease forwards}
@keyframes bfill{0%{width:0}100%{width:95%}}

/* ── Header (Compact Navy Design) ── */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,#0d3a73 100%);padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 4px 24px rgba(10,46,92,.35)}
.bk{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;transition:all .2s;min-width:44px;min-height:44px}
.bk:hover{background:rgba(255,255,255,.25)}
.bk:active{transform:scale(.92)}
.hi{flex:1}.hi h1{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.3px;font-family:var(--font-heading)}.hi p{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:2px;font-family:var(--font-body)}
.hdr img{width:40px;height:40px;border-radius:50%;border:2px solid rgba(201,162,39,.6);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-badge{background:linear-gradient(135deg,rgba(201,162,39,.25),rgba(242,140,40,.25));backdrop-filter:blur(8px);border:1px solid rgba(201,162,39,.4);padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;color:rgba(255,255,255,.95);white-space:nowrap;font-family:var(--font-heading)}

/* ── Search ── */
.ui-top{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 62px);left:0;right:0;z-index:95;padding:0 12px}
.search-wrap{position:relative;display:flex;align-items:center;background:rgba(255,255,255,.98);border-radius:28px;box-shadow:0 4px 20px rgba(0,0,0,.18);border:2px solid transparent;transition:border-color .2s,box-shadow .2s}
.search-wrap:focus-within{border-color:var(--orange);box-shadow:0 4px 24px rgba(242,140,40,.35)}
.search-ico{padding:0 4px 0 16px;font-size:16px;line-height:1;opacity:.5}
.si{flex:1;padding:13px 8px 13px 4px;border:none;background:transparent;font-size:14px;font-weight:500;color:var(--text-primary);outline:none;font-family:var(--font-body);min-height:48px}
.si::placeholder{color:var(--text-tertiary);font-weight:500}
.search-clear{width:36px;height:36px;margin-right:6px;border-radius:50%;border:none;background:var(--bg-light);color:var(--text-secondary);font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;transition:all .2s;min-width:44px;min-height:44px}
.search-clear:hover{background:#e2e8f0;color:var(--text-primary)}
.search-clear.on{display:flex}
.srch-drop{display:none;margin-top:8px;background:rgba(255,255,255,.98);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.2);max-height:320px;overflow-y:auto;scrollbar-width:thin}
.srch-drop.on{display:block;animation:dropIn .2s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.srch-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #f2f2f2;transition:background .15s;min-height:70px}
.srch-item:last-child{border-bottom:none}
.srch-item:active,.srch-item:hover{background:#f8fafc}
.srch-item-img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.srch-item-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.srch-item-ico.star{background:linear-gradient(135deg,var(--orange),var(--gold))}
.srch-item-ico.heritage{background:linear-gradient(135deg,#8e44ad,#9b59b6)}
.srch-item-ico.barangay{background:linear-gradient(135deg,#27ae60,#2ecc71)}
.srch-item-ico.city{background:linear-gradient(135deg,var(--navy),#0d3a73)}
.srch-item-body{flex:1;min-width:0}
.srch-item-name{font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-heading)}
.srch-item-sub{font-size:11px;color:var(--text-secondary);font-weight:600;margin-top:2px;font-family:var(--font-body)}
.srch-empty{padding:20px;text-align:center;font-size:13px;color:var(--text-secondary);font-family:var(--font-body)}
.srch-hl{background:rgba(242,140,40,.2);border-radius:3px;padding:0 2px;color:var(--orange);font-weight:700}

/* ── Quick picks ── */
.srch-popular{padding:14px 16px 10px}
.srch-popular-label{font-size:10px;font-weight:800;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;font-family:var(--font-heading)}
.srch-popular-chips{display:flex;gap:8px;flex-wrap:wrap}
.srch-popular-chips .qp{font-size:11px;font-weight:700;padding:8px 14px;border-radius:20px;border:2px solid #e8e8e8;background:#f8f8f8;color:var(--text-primary);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--font-body);min-height:36px}
.srch-popular-chips .qp:active,.srch-popular-chips .qp:hover{background:rgba(242,140,40,.1);border-color:var(--orange);color:var(--orange)}
body.dark-mode .srch-popular-label{color:#888}
body.dark-mode .srch-popular-chips .qp{background:#1f1f1f;border-color:#333;color:#ccc}
body.dark-mode .srch-popular-chips .qp:hover{background:rgba(242,140,40,.15);border-color:var(--orange);color:var(--orange)}

/* ── Category Filter Chips ── */
.filter-container{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 122px);left:0;right:0;z-index:94;padding:0 12px}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:9px 16px;border-radius:24px;border:2px solid rgba(255,255,255,.3);background:rgba(10,46,92,.85);backdrop-filter:blur(12px);color:rgba(255,255,255,.9);font-size:11.5px;font-weight:800;cursor:pointer;transition:all .2s ease;user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;font-family:var(--font-heading);min-height:44px;display:flex;align-items:center;gap:6px}
.filter-chip:active{transform:scale(.96)}
.filter-chip.active{background:linear-gradient(135deg,var(--navy),#0d3a73);border-color:var(--gold);color:var(--white);box-shadow:0 4px 16px rgba(10,46,92,.4)}
.filter-chip .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;background:rgba(255,255,255,.2);border-radius:10px;font-size:10px;font-weight:800}
.filter-chip.active .cnt{background:rgba(201,162,39,.3);color:var(--white)}

/* ── Legend ── */
.legend{position:fixed;bottom:100px;left:14px;z-index:88;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.18);font-size:10px;font-weight:600;color:var(--text-secondary);border:1px solid rgba(10,46,92,.08);font-family:var(--font-body)}
.legend-title{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:8px;font-family:var(--font-heading)}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.legend-row:last-child{margin-bottom:0}
.legend-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid var(--white);box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* ── Map controls ── */
.mapboxgl-ctrl-bottom-right{bottom:100px!important;right:14px!important}
.mapboxgl-ctrl-attrib{font-size:9px!important;font-family:var(--font-body)!important}

/* ── Barangay markers ── */
.bp{cursor:pointer;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;transition:opacity .3s,filter .3s}
.bp:hover .bpill{transform:scale(1.12)}
.bp.sel .bpill{transform:scale(1.18);box-shadow:0 0 0 3px var(--white),0 4px 20px rgba(242,140,40,.6)}
.bp.dim{opacity:.06!important;pointer-events:none!important}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bpill{padding:6px 13px;border-radius:22px;font-size:10.5px;font-weight:800;color:var(--white);border:2px solid rgba(255,255,255,.95);box-shadow:0 2px 12px rgba(0,0,0,.45);white-space:nowrap;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;font-family:var(--font-heading)}
.bp.u .bpill{background:linear-gradient(135deg,var(--navy),#0d3a73)}
.bp.r .bpill{background:linear-gradient(135deg,#27ae60,#1e8449)}
.bp.t .bpill{background:linear-gradient(135deg,var(--orange),var(--gold));box-shadow:0 2px 14px rgba(242,140,40,.5)}

/* ── Landmark markers ── */
.lm{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.lm:hover{transform:scale(1.15)}
.lm.sel{transform:scale(1.25)}
.lm.dim{opacity:.05!important;pointer-events:none!important}
.lmi{width:44px;height:44px;border-radius:50%;border:3px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:box-shadow .2s;position:relative}
.lm-star .lmi{width:54px;height:54px;font-size:24px;background:linear-gradient(135deg,var(--orange),var(--gold));box-shadow:0 4px 24px rgba(242,140,40,.55)}
.lm-star .lmi::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(242,140,40,.4);animation:ring 2.2s ease-out infinite}
.lm-heritage .lmi{background:linear-gradient(135deg,#8e44ad,#9b59b6);font-size:18px}
.lm-heritage .lmi::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(142,68,173,.4);animation:ring 2.5s ease-out infinite}
.lm-city .lmi{width:38px;height:38px;font-size:16px;background:linear-gradient(135deg,var(--navy),#0d3a73);opacity:.9}
.lm-city .lmt{opacity:.85}
.lmt{padding:4px 10px;border-radius:12px;font-size:9.5px;font-weight:900;color:var(--white);background:rgba(10,46,92,.92);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.35);font-family:var(--font-heading)}
.lm-star .lmt{background:linear-gradient(135deg,#d97706,var(--orange));font-size:10px;max-width:130px}
@keyframes ring{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(1.7);opacity:0}}

/* ── FABs (Redesigned) ── */
.fabs{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:90;padding:0 14px;flex-wrap:wrap}
.fab{padding:12px 18px;border-radius:28px;border:none;cursor:pointer;font-size:12px;font-weight:800;color:var(--white);box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .2s;-webkit-tap-highlight-color:transparent;font-family:var(--font-heading);min-height:52px}
.fab:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.fab:active{transform:scale(.96)}
.freset{background:linear-gradient(135deg,var(--navy),#0d3a73);border:1px solid rgba(201,162,39,.3)}
.fshowall{background:linear-gradient(135deg,var(--orange),var(--gold))}
.floc{background:linear-gradient(135deg,#3498db,#2980b9)}
.fdark{background:linear-gradient(135deg,#2c3e50,#34495e)}
.f3d{background:rgba(30,30,35,.92);backdrop-filter:blur(10px);border:1px solid #555}

/* Mobile responsive FABs */
@media (max-width:768px){
  .fabs{gap:8px;padding:0 10px}
  .fab{padding:10px 14px;font-size:11px;min-height:44px;gap:5px}
}
@media (max-width:480px){
  .fabs{gap:6px;padding:0 8px;bottom:max(12px,env(safe-area-inset-bottom))}
  .fab{padding:9px 12px;font-size:10px;min-height:40px;border-radius:24px}
}

/* ── Dark Mode ── */
body.dark-mode{background:#0a0a0a}
body.dark-mode .search-wrap{background:rgba(30,30,30,.96);border-color:#333}
body.dark-mode .si{color:var(--white)}
body.dark-mode .si::placeholder{color:#666}
body.dark-mode .srch-drop{background:rgba(30,30,30,.96)}
body.dark-mode .srch-item{border-bottom-color:#2a2a2a}
body.dark-mode .srch-item:active,body.dark-mode .srch-item:hover{background:#1f1f1f}
body.dark-mode .srch-item-name{color:var(--white)}
body.dark-mode .srch-item-sub{color:#888}
body.dark-mode .legend{background:rgba(30,30,30,.96);border-color:#333}
body.dark-mode .legend-title{color:var(--white)}
body.dark-mode .legend-row{color:#aaa}
body.dark-mode .filter-chip{background:rgba(30,30,35,.9);border-color:#444;color:#ccc}
body.dark-mode .filter-chip.active{background:linear-gradient(135deg,var(--navy),#0d3a73);border-color:var(--gold);color:var(--white)}

/* ── Detail panel ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:299;display:none;backdrop-filter:blur(8px)}
.ov.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.pan{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:linear-gradient(180deg,#252528 0%,#1c1c1e 100%);border-radius:28px 28px 0 0;padding:0;z-index:300;display:none;border-top:4px solid var(--gold);box-shadow:0 -10px 48px rgba(0,0,0,.75);max-height:80vh;overflow-y:auto}
.pan.on{display:block;animation:su .35s cubic-bezier(.25,.46,.45,.94)}
@keyframes su{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
.ph{width:44px;height:5px;background:#444;border-radius:3px;margin:16px auto 0}
.pc{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:#333;border:none;color:#aaa;font-size:22px;cursor:pointer;transition:all .2s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;z-index:10}
.pc:hover{background:#3a3a3a;color:#ddd}
.pan-img{width:100%;height:220px;object-fit:cover;border-radius:0;display:block}
.pan-content{padding:20px 22px max(40px,env(safe-area-inset-bottom))}
.pan-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pan-ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.pan-ico.star{background:linear-gradient(135deg,var(--orange),var(--gold))}
.pan-ico.heritage{background:linear-gradient(135deg,#8e44ad,#9b59b6)}
.pan-ico.barangay{background:linear-gradient(135deg,#27ae60,#2ecc71)}
.pan-ico.city{background:linear-gradient(135deg,var(--navy),#0d3a73)}
#pname{font-size:22px;font-weight:900;color:var(--white);line-height:1.2;font-family:var(--font-heading)}
#ptype{display:inline-block;font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:12px;font-family:var(--font-heading)}
#pdesc{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:12px;font-family:var(--font-body)}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fp{background:rgba(10,46,92,.3);color:#74b9ff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;font-family:var(--font-body)}
.sp{background:linear-gradient(135deg,rgba(242,140,40,.15),rgba(201,162,39,.15));color:var(--gold);font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid rgba(201,162,39,.3);font-family:var(--font-body)}
.gm{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:16px;background:linear-gradient(135deg,#0369a1,#0ea5e9);color:var(--white);border-radius:16px;font-size:14px;font-weight:700;text-decoration:none;font-family:var(--font-heading);transition:all .2s;min-height:52px}
.gm:hover{background:linear-gradient(135deg,#0284c7,#06b6d4);transform:translateY(-2px)}
.gm:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="ldr">
  <img src="assets/images/bago-city-logo.png" alt="Bago City Logo">
  <h2>Bago City Explorer</h2>
  <p>Discover landmarks, culture and natural beauty...</p>
  <div class="bw"><div class="bf"></div></div>
</div>
<div id="map"></div>

<div class="hdr">
  <a href="javascript:history.back()" class="bk" aria-label="Go back">&#8592;</a>
  <div class="hi">
    <h1>Bago City Explorer</h1>
    <p>Discover the landmarks, culture and natural beauty of Bago City</p>
  </div>
  <span class="hdr-badge" id="spot-count">28 spots</span>
  <img src="assets/images/bago-city-logo.png" alt="Bago City">
</div>

<div class="ui-top">
  <div class="search-wrap">
    <span class="search-ico" aria-label="Search">🔍</span>
    <input class="si" id="srch" type="search" placeholder="Search landmarks, waterfalls, parks and barangays..." autocomplete="off" enterkeyhint="search" aria-label="Search attractions" onkeydown="if(event.key==='Enter'){event.preventDefault();doSearch(this.value,true);this.blur();}">
    <button class="search-clear" id="srch-clr" type="button" aria-label="Clear search" onclick="clearSearch()">×</button>
  </div>
  <div class="srch-drop" id="srch-drop">
    <div class="srch-popular" id="srch-popular">
      <div class="srch-popular-label">Popular Places</div>
      <div class="srch-popular-chips" id="quick-picks"></div>
    </div>
  </div>
</div>

<div class="filter-container">
  <div class="filter-scroll">
    <button class="filter-chip active" data-filter="all" onclick="doFilter('all',this)">
      <span>All Places</span>
      <span class="cnt" id="filter-all-cnt">28</span>
    </button>
    <button class="filter-chip" data-filter="star" onclick="doFilter('star',this)">
      <span>Nature & Waterfalls</span>
      <span class="cnt" id="filter-star-cnt">14</span>
    </button>
    <button class="filter-chip" data-filter="heritage" onclick="doFilter('heritage',this)">
      <span>Historical & Heritage</span>
      <span class="cnt" id="filter-heritage-cnt">7</span>
    </button>
    <button class="filter-chip" data-filter="city" onclick="doFilter('city',this)">
      <span>City Services</span>
      <span class="cnt" id="filter-city-cnt">7</span>
    </button>
  </div>
</div>

<div class="legend" id="legend">
  <div class="legend-title">Map Legend</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,var(--orange),var(--gold))"></span> Must-see attraction</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,#8e44ad,#9b59b6)"></span> Heritage site</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,var(--orange),var(--gold))"></span> Tourist barangay</div>

function spotTier(s){return s.tier||(s.cat==="Tourist Spot"||s.cat==="Park"||s.cat==="Nature Park"?"star":s.cat==="Heritage"||s.cat==="Religious"?"heritage":"city")}
function isStarSpot(s){return spotTier(s)==="star"}
function isHeritageSpot(s){return spotTier(s)==="heritage"}

const map=new mapboxgl.Map({

});

function buildSearchIndex(){
  searchIndex=[];
  BARANGAYS.forEach(b=>{
    searchIndex.push({kind:"barangay",name:b.name,sub:b.type==="t"?"Tourist Barangay":"Barangay "+b.num,icon:"📍",tier:"barangay",lng:b.lng,lat:b.lat,data:b,searchText:[b.name,b.spots,b.desc,b.fiesta].join(" ").toLowerCase()});
  });
  SPOTS_DEDUPED.forEach(s=>{
    const t=spotTier(s);
    searchIndex.push({kind:"spot",name:s.name,sub:s.cat,icon:s.icon,tier:t,lng:s.lng,lat:s.lat,data:s,searchText:[s.name,s.cat,s.desc,s.spots].join(" ").toLowerCase()});
  });
}

function initQuickPicks(){
  const el=document.getElementById("quick-picks");
  el.innerHTML=QUICK_PICKS.map(p=>`<button class="qp star" type="button" data-q="${p.q}">${p.label}</button>`).join("");
  el.querySelectorAll(".qp").forEach(btn=>{
    const p=QUICK_PICKS.find(x=>x.q===btn.dataset.q);
    btn.onclick=()=>{
      // Set search text
      document.getElementById("srch").value=p.q;
      document.getElementById("srch-clr").classList.add("on");
      document.getElementById("srch-drop").classList.remove("on");
      // Fly directly to the known coordinates — no fuzzy search
      map.flyTo({center:[p.lng,p.lat],zoom:16,duration:900,essential:true});
      // Find and highlight the matching marker
      const hitLM=LM.find(x=>x.s.name===p.q);
      const hitBM=BM.find(x=>x.b.name===p.q);
      const hit=hitLM||hitBM;
      if(hit){
        if(activeEl&&activeEl!==hit.el)activeEl.classList.remove("sel");
        activeEl=hit.el;
        hit.el.classList.add("sel");
      }
    };
  });
}

function initFilterCounts(){
  // Update filter chip counts
  const starCount=SPOTS.filter(s=>spotTier(s)==='star').length;
  const heritageCount=SPOTS.filter(s=>spotTier(s)==='heritage').length;
  const cityCount=SPOTS.filter(s=>spotTier(s)==='city').length;
  const totalCount=SPOTS.length;
  
  const starEl=document.getElementById('filter-star-cnt');
  const heritageEl=document.getElementById('filter-heritage-cnt');
  const cityEl=document.getElementById('filter-city-cnt');
  const allEl=document.getElementById('filter-all-cnt');
  
  if(starEl) starEl.textContent=starCount;
  if(heritageEl) heritageEl.textContent=heritageCount;
  if(cityEl) cityEl.textContent=cityCount;
  if(allEl) allEl.textContent=totalCount;
  
  // Update header badge
  const sc=document.getElementById("spot-count");
  if(sc) sc.textContent=starCount+" must-see";
}

document.getElementById("srch").addEventListener("input",e=>doSearch(e.target.value,false));
document.getElementById("srch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doSearch(e.target.value,true);e.target.blur();}});
document.getElementById("srch").addEventListener("focus",()=>{
  const v=document.getElementById("srch").value;
  if(v){
    doSearch(v,false);
  } else {
    // Show popular picks when search is empty and focused
    const drop=document.getElementById("srch-drop");
    drop.classList.add("on");
    document.getElementById("srch-popular").style.display="block";
  }
});
document.getElementById("srch").addEventListener("blur",()=>{
  // Small delay so clicks on items register first
  setTimeout(()=>{
    if(!document.getElementById("srch").value){
      document.getElementById("srch-drop").classList.remove("on");
    }
  },200);
});

const _sc=document.getElementById("spot-count");
if(_sc) _sc.textContent=SPOTS_DEDUPED.filter(isStarSpot).length+" must-see";

map.on("load",()=>{
  const ldr=document.getElementById("ldr");
  ldr.classList.add("done");
  setTimeout(()=>ldr.style.display="none",600);
  initFilterCounts();

  map.addSource("dem",{type:"raster-dem",url:"mapbox://mapbox.mapbox-terrain-dem-v1",tileSize:512});
  map.setTerrain({source:"dem",exaggeration:1.5});
  // Enhanced fog effects for immersive 3D experience
  map.setFog({
    color:"rgb(220,235,255)",
    "horizon-blend":0.1,
    "high-color":"rgb(36,92,223)",
    "space-color":"rgb(11,11,25)",
    "star-intensity":0.15
  });

  BARANGAYS.forEach((b,i)=>{
    const el=document.createElement("div");
    el.className="bp "+b.type;
    el.innerHTML="<div class=bpill>"+b.name+"</div>";
    el.style.animationDelay=(i*30)+"ms";
    el.onclick=()=>onTap(el,b.lng,b.lat,()=>showPan(b));
    new mapboxgl.Marker({element:el,anchor:"center"}).setLngLat([b.lng,b.lat]).addTo(map);
    BM.push({el,b});
  });

  SPOTS_DEDUPED.forEach((s,i)=>{
    const t=spotTier(s);
    const el=document.createElement("div");
    el.className="lm lm-"+t;
    el.style.animationDelay=((BARANGAYS.length+i)*30)+"ms";
    const sh=s.name.length>14?s.name.slice(0,13)+"…":s.name;
    el.innerHTML="<div class=lmi>"+s.icon+"</div><div class=lmt>"+sh+"</div>";
    const info={name:s.name,type:"landmark",cat:s.cat,tier:t,icon:s.icon,desc:s.desc,spots:s.spots,image:s.image,dist:"",pop:"",area:"",fiesta:""};
    el.onclick=()=>onTap(el,s.lng,s.lat,()=>showPan(info));
    new mapboxgl.Marker({element:el,anchor:"top"}).setLngLat([s.lng,s.lat]).addTo(map);
    LM.push({el,s,info,t});
  });

  buildSearchIndex();
  initQuickPicks();
  
  // Add 3D buildings layer (conditionally enabled)
  init3DBuildings();
  
  // Set initial filter to "all" instead of "star"
  doFilter("all",document.querySelector('[data-filter="all"]'));

  function syncZ(){
    const z=map.getZoom();
    BM.forEach(({el})=>{
      if(el.classList.contains("dim"))return;
      if(activeFilter==="star"||activeFilter==="heritage"||activeFilter==="city"){el.style.opacity="0";el.style.pointerEvents="none";return;}
      el.style.opacity=z<10.8?"0":z<11.2?"0.45":"1";
      el.style.pointerEvents=z<10.8?"none":"auto";
    });
    LM.forEach(({el,t})=>{
      if(el.classList.contains("dim"))return;
      if(t==="star"){el.style.opacity="1";el.style.pointerEvents="auto";return;}
      el.style.opacity=z<11?"0.35":z<11.8?"0.7":"1";
      el.style.pointerEvents=z<10.8?"none":"auto";
    });
  }
  map.on("zoom",syncZ);

  setTimeout(()=>{
    map.easeTo({pitch:25,duration:1400});
    setTimeout(()=>map.easeTo({pitch:0,duration:1000}),2200);
  },500);
});

function onTap(el,lng,lat,cb){
  if(activeEl&&activeEl!==el)activeEl.classList.remove("sel");
  activeEl=el;el.classList.add("sel");
  map.easeTo({center:[lng,lat],zoom:Math.max(map.getZoom(),14),duration:600,easing:t=>1-Math.pow(1-t,3)});
  setTimeout(cb,300);
}

function applyMarkerVisibility(type){
  activeFilter=type;
  BM.forEach(({el,b})=>{
    let show=false;
    if(type==="all")show=true;
    else if(type==="u")show=b.type==="u";
    else if(type==="r")show=b.type==="r";
    else if(type==="t")show=b.type==="t";
    el.classList.toggle("dim",!show);
    if(show){el.style.opacity="1";el.style.pointerEvents="auto";}
    else el.style.opacity="";
  });
  LM.forEach(({el,t})=>{
    let show=false;
    if(type==="all")show=true;
    else if(type==="star")show=t==="star";
    else if(type==="heritage")show=t==="heritage";
    else if(type==="city")show=t==="city";
    else show=false;
    el.classList.toggle("dim",!show);
    if(show){el.style.opacity="1";el.style.pointerEvents="auto";}
    else el.style.opacity="";
  });
}

function fitToVisible(){
  const coords=[];
  BM.forEach(({el,b})=>{if(!el.classList.contains("dim"))coords.push([b.lng,b.lat]);});
  LM.forEach(({el,s})=>{if(!el.classList.contains("dim"))coords.push([s.lng,s.lat]);});
  if(coords.length<2)return;
  const bounds=coords.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds(coords[0],coords[0]));
  map.fitBounds(bounds,{padding:{top:220,bottom:100,left:40,right:40},duration:900,maxZoom:14});
}

function doFilter(type,chip){
  // Update active state on filter chips
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  if(chip)chip.classList.add("active");
  
  applyMarkerVisibility(type);
  
  if(type==="star"||type==="heritage"||type==="city"){
    fitToVisible();
  }else if(type==="all"){
    // Show all markers at default view
    map.flyTo({center:CENTER,zoom:INITIAL_ZOOM,pitch:0,bearing:0,duration:800});
  }
  
  map.fire("zoom");
}

function highlightMatch(text,q){
  if(!q)return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text;
  return text.slice(0,i)+'<span class="srch-hl">'+text.slice(i,i+q.length)+"</span>"+text.slice(i+q.length);
}

function selectSearchResult(item){
  document.getElementById("srch-drop").classList.remove("on");
  document.getElementById("srch").value=item.name;
  document.getElementById("srch-clr").classList.add("on");
  
  // Fly to location and highlight marker — tap marker to see details
  map.flyTo({center:[item.lng,item.lat],zoom:16,duration:900,essential:true});
  
  // Highlight the marker
  if(item.kind==="barangay"){
    const hit=BM.find(x=>x.b.name===item.name);
    if(hit){
      if(activeEl&&activeEl!==hit.el)activeEl.classList.remove("sel");
      activeEl=hit.el;
      hit.el.classList.add("sel");
    }
  }else{
    const hit=LM.find(x=>x.s.name===item.name);
    if(hit){
      if(activeEl&&activeEl!==hit.el)activeEl.classList.remove("sel");
      activeEl=hit.el;
      hit.el.classList.add("sel");
    }
  }
}

// Debounce timer
let _searchTimer = null;

function doSearch(v,openFirst){
  // Debounce — wait 300ms after user stops typing
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(()=>_doSearchNow(v,openFirst), 300);
}

function _doSearchNow(v,openFirst){
  const q=v.trim();
  const clr=document.getElementById("srch-clr");
  const drop=document.getElementById("srch-drop");
  clr.classList.toggle("on",!!q);

  if(!q){
    drop.classList.remove("on");
    applyMarkerVisibility(activeFilter);
    return;
  }

  // Hide popular picks when typing
  const popular=document.getElementById("srch-popular");
  if(popular) popular.style.display="none";

  document.querySelectorAll(".ch").forEach(c=>c.classList.remove("on"));
  const ql=q.toLowerCase();
  // Get all matches, then sort: name matches first, spot/desc matches second
  const allMatches=searchIndex.filter(item=>item.searchText.includes(ql));
  allMatches.sort((a,b)=>{
    const aName=a.name.toLowerCase().includes(ql)?0:1;
    const bName=b.name.toLowerCase().includes(ql)?0:1;
    return aName-bName;
  });
  const matches=allMatches.slice(0,8);

  BM.forEach(({el,b})=>{
    const m=b.name.toLowerCase().includes(ql)||(b.spots&&b.spots.toLowerCase().includes(ql))||b.desc.toLowerCase().includes(ql);
    el.classList.toggle("dim",!m);
    el.style.opacity=m?"1":"";
    el.style.pointerEvents=m?"auto":"none";
  });
  LM.forEach(({el,s})=>{
    const m=s.name.toLowerCase().includes(ql)||s.cat.toLowerCase().includes(ql)||s.desc.toLowerCase().includes(ql)||(s.spots&&s.spots.toLowerCase().includes(ql));
    el.classList.toggle("dim",!m);
    el.style.opacity=m?"1":"";
    el.style.pointerEvents=m?"auto":"none";
  });

  if(matches.length){
    drop.innerHTML=matches.map((item,i)=>{
      const icoClass=item.tier==="star"?"star":item.tier==="heritage"?"heritage":item.tier==="barangay"?"barangay":"city";
      return `<div class="srch-item" data-idx="${i}"><div class="srch-item-ico ${icoClass}">${item.icon}</div><div class="srch-item-body"><div class="srch-item-name">${highlightMatch(item.name,q)}</div><div class="srch-item-sub">${item.sub}</div></div></div>`;
    }).join("");
    drop.classList.add("on");
    drop.querySelectorAll(".srch-item").forEach((row,i)=>row.onclick=()=>selectSearchResult(matches[i]));
    // Only auto-fly if user pressed Enter (openFirst=true), not while typing
    if(openFirst && matches[0]) selectSearchResult(matches[0]);
  }else{
    drop.innerHTML='<div class="srch-empty">No results — try "falls", "park", or a barangay name</div>';
    drop.classList.add("on");
  }
}

function clearSearch(){
  document.getElementById("srch").value="";
  document.getElementById("srch-clr").classList.remove("on");
  document.getElementById("srch-drop").classList.remove("on");
  const popular=document.getElementById("srch-popular");
  if(popular) popular.style.display="none";
  applyMarkerVisibility(activeFilter);
  document.querySelector('[data-filter="'+activeFilter+'"]')?.classList.add("active");
}

function do3D(){
  is3D=!is3D;
  const btn=document.getElementById("btn3d");
  if(is3D){
    // Enhanced 3D mode with better terrain and camera
    map.easeTo({
      pitch:60,
      bearing:-25,
      duration:1200,
      easing:t=>1-Math.pow(1-t,3)
    });
    // Increase terrain exaggeration in 3D mode for dramatic effect
    map.setTerrain({source:"dem",exaggeration:1.8});
    btn.innerHTML="🗺️ Flat";
    btn.style.background="linear-gradient(135deg,#1a3050,#0369a1)";
  }else{
    // Return to 2D with standard terrain
    map.easeTo({
      pitch:0,
      bearing:0,
      duration:1000,
      easing:t=>t<0.5?2*t*t:-1+(4-2*t)*t
    });
    map.setTerrain({source:"dem",exaggeration:1.5});
    btn.innerHTML="🏔️ 3D";
    btn.style.background="";
  }
}

function resetMap(){
  // Clear search
  document.getElementById("srch").value="";
  document.getElementById("srch-clr").classList.remove("on");
  document.getElementById("srch-drop").classList.remove("on");
  
  // Reset to "All Places" filter
  const allChip=document.querySelector('[data-filter="all"]');
  doFilter('all',allChip);
  
  // Reset map view
  map.flyTo({
    center:CENTER,
    zoom:INITIAL_ZOOM,
    pitch:0,
    bearing:0,
    duration:1200,
    easing:(t)=>t<.5?2*t*t:-1+(4-2*t)*t/2
  });
  
  // Clear any selected marker
  if(activeEl){
    activeEl.classList.remove("sel");
    activeEl=null;
  }
  
  // Hide detail panel
  hidePan();
}

function showAllAttractions(){
  // Clear search
  document.getElementById("srch").value="";
  document.getElementById("srch-clr").classList.remove("on");
  document.getElementById("srch-drop").classList.remove("on");
  
  // Show all markers
  BM.forEach(({el})=>{
    el.classList.remove("dim");
    el.style.opacity="1";
    el.style.pointerEvents="auto";
  });
  LM.forEach(({el})=>{
    el.classList.remove("dim");
    el.style.opacity="1";
    el.style.pointerEvents="auto";
  });
  
  // Fit map to show all attractions
  const coords=[];
  BM.forEach(({b})=>coords.push([b.lng,b.lat]));
  LM.forEach(({s})=>coords.push([s.lng,s.lat]));
  
  if(coords.length>0){
    const bounds=coords.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds(coords[0],coords[0]));
    map.fitBounds(bounds,{
      padding:{top:240,bottom:120,left:60,right:60},
      duration:1200,
      maxZoom:13,
      pitch:0,
      bearing:0
    });
  }
  
  // Update filter to show all
  const allChip=document.querySelector('[data-filter="all"]');
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  if(allChip)allChip.classList.add("active");
  activeFilter="all";
}

function doHome(){
  resetMap();
}

function locateUser(){
  if(!navigator.geolocation){
    alert('Geolocation is not supported by your browser');
    return;
  }
  
  const btn=document.getElementById('btn-loc');
  btn.innerHTML='🔄 Locating...';
  btn.disabled=true;
  
  navigator.geolocation.getCurrentPosition(
    position=>{
      const{lng,lat}=position.coords;
      map.flyTo({center:[lng,lat],zoom:15,duration:1200});
      
      new mapboxgl.Marker({color:'#3498db'})
        .setLngLat([lng,lat])
        .setPopup(new mapboxgl.Popup({offset:25}).setHTML('<div style="padding:8px;font-size:12px;font-weight:700;color:#333">📍 You are here</div>'))
        .addTo(map);
      
      btn.innerHTML='📍 My Location';
      btn.disabled=false;
    },
    error=>{
      let msg='Unable to retrieve your location';
      switch(error.code){
        case error.PERMISSION_DENIED:
          msg='Location access denied. Please enable location services in your browser settings.';
          break;
        case error.POSITION_UNAVAILABLE:
          msg='Location information is unavailable.';
          break;
        case error.TIMEOUT:
          msg='Location request timed out.';
          break;
      }
      alert(msg);
      btn.innerHTML='📍 My Location';
      btn.disabled=false;
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }
  );
}

function toggleDarkMode(){
  document.body.classList.toggle('dark-mode');
  const btn=document.getElementById('btn-dark');
  const isDark=document.body.classList.contains('dark-mode');
  btn.innerHTML=isDark?'☀️ Light':'🌙 Dark';
  
  // Switch map style for dark mode
  if(isDark){
    map.setStyle('mapbox://styles/mapbox/dark-v11');
  }else{
    map.setStyle('mapbox://styles/mapbox/outdoors-v12');
  }
  
  // Save preference
  localStorage.setItem('bago_dark_mode',isDark);
}

// Load dark mode preference on page load
if(localStorage.getItem('bago_dark_mode')==='true'){
  document.body.classList.add('dark-mode');
  document.getElementById('btn-dark').innerHTML='☀️ Light';
}

function showPan(p){
  const isBrgy=!!p.num;
  const isLm=p.type==="landmark";
  const tier=p.tier||(isBrgy?(p.type==="t"?"barangay":"barangay"):isLm?spotTier(p):"city");

  // Show image if available (for landmarks/spots)
  const panImg = document.getElementById("pan-img");
  if (p.image && !isBrgy) {
    panImg.src = p.image;
    panImg.alt = p.name;
    panImg.style.display = "block";
  } else {
    panImg.style.display = "none";
  }

  document.getElementById("pname").textContent=p.name;
  const icoEl=document.getElementById("pan-ico");
  icoEl.textContent=isLm?(p.icon||"📍"):(p.type==="t"?"🏞️":"📍");
  icoEl.className="pan-ico "+(isLm?(p.tier||"city"):p.type==="t"?"star":"barangay");

  const t=document.getElementById("ptype");
  if(isBrgy){
    t.textContent=p.type==="u"?"🏙️ Urban Barangay":p.type==="t"?"⭐ Tourist Barangay":"🌾 Rural Barangay";
    t.style.background=p.type==="u"?"rgba(231,76,60,.2)":p.type==="t"?"rgba(243,156,18,.25)":"rgba(39,174,96,.2)";
    t.style.color=p.type==="u"?"#ff7675":p.type==="t"?"#fdcb6e":"#55efc4";
  }else{
    const labels={star:"⭐ Must-See Attraction",heritage:"🏛️ Heritage Site",city:"🏢 City Service"};
    t.textContent=labels[p.tier]||"📍 "+p.cat;
    t.style.background=p.tier==="star"?"rgba(243,156,18,.25)":p.tier==="heritage"?"rgba(142,68,173,.25)":"rgba(52,152,219,.2)";
    t.style.color=p.tier==="star"?"#fdcb6e":p.tier==="heritage"?"#d7bde2":"#74b9ff";
  }

  document.getElementById("pdesc").textContent=p.desc||"";
  const f=[];
  if(p.num)f.push("🔢 Brgy. No. "+p.num);
  if(p.dist&&p.dist!=="—")f.push("📍 "+p.dist+" from city");
  if(p.pop&&p.pop!=="—")f.push("👥 Pop. "+p.pop);
  if(p.area&&p.area!=="—")f.push("📐 "+p.area);
  if(p.fiesta&&p.fiesta!=="—")f.push("🎉 "+p.fiesta);
  document.getElementById("pfacts").innerHTML=f.map(x=>"<span class=fp>"+x+"</span>").join("");
  document.getElementById("pspots").innerHTML=p.spots?p.spots.split("|").map(s=>"<span class=sp>"+s.trim()+"</span>").join(""):"";
  document.getElementById("pgm").href="https://maps.google.com/?q="+encodeURIComponent(p.name+" Bago City Negros Occidental");
  document.getElementById("pan").classList.add("on");
  document.getElementById("ov").classList.add("on");
}

function hidePan(){
  document.getElementById("pan").classList.remove("on");
  document.getElementById("ov").classList.remove("on");
  if(activeEl){activeEl.classList.remove("sel");activeEl=null;}
}

function init3DBuildings(){
  // Check if the current style supports building layer
  // Mapbox Streets style includes building data in 'composite' source
  try {
    const style = map.getStyle();
    if (!style || !style.sources || !style.sources.composite) {
      console.log('3D buildings not available in current style');
      return;
    }
    
    // Find the label layer to insert buildings below labels
    const layers = style.layers;
    let labelLayerId;
    for (let i = 0; i < layers.length; i++) {
      if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
        labelLayerId = layers[i].id;
        break;
      }
    }
    
    // Add 3D buildings layer (hidden by default)
    map.addLayer({
      'id': '3d-buildings',
      'source': 'composite',
      'source-layer': 'building',
      'filter': ['==', 'extrude', 'true'],
      'type': 'fill-extrusion',
      'minzoom': 14,
      'layout': {
        'visibility': 'none'  // Hidden by default
      },
      'paint': {
        'fill-extrusion-color': [
          'interpolate',
          ['linear'],
          ['get', 'height'],
          0, '#aaaaaa',
          50, '#999999',
          100, '#888888'
        ],
        'fill-extrusion-height': [
          'interpolate',
          ['linear'],
          ['zoom'],
          14, 0,
          14.5, ['get', 'height']
        ],
        'fill-extrusion-base': [
          'interpolate',
          ['linear'],
          ['zoom'],
          14, 0,
          14.5, ['get', 'min_height']
        ],
        'fill-extrusion-opacity': 0.7
      }
    }, labelLayerId);
    
    // Show buildings button
    const buildingsBtn = document.getElementById('btn-buildings');
    if (buildingsBtn) {
      buildingsBtn.style.display = 'flex';
    }
    
    console.log('3D buildings layer initialized');
  } catch (error) {
    console.log('Could not initialize 3D buildings:', error.message);
  }
}

function toggle3DBuildings(){
  buildings3DEnabled = !buildings3DEnabled;
  const btn = document.getElementById('btn-buildings');
  
  try {
    const visibility = buildings3DEnabled ? 'visible' : 'none';
    map.setLayoutProperty('3d-buildings', 'visibility', visibility);
    
    if (buildings3DEnabled) {
      btn.innerHTML = '🏢 Hide Buildings';
      btn.style.background = 'linear-gradient(135deg,#e67e22,#d35400)';
      
      // Zoom in if too far out
      if (map.getZoom() < 14) {
        map.easeTo({
          zoom: 14.5,
          duration: 1000
        });
      }
      
      // Auto-enable 3D mode if not already enabled
      if (!is3D) {
        do3D();
      }
    } else {
      btn.innerHTML = '🏢 Buildings';
      btn.style.background = '';
    }
  } catch (error) {
    console.log('Could not toggle 3D buildings:', error.message);
    // Hide button if layer doesn't exist
    btn.style.display = 'none';
  }
}
