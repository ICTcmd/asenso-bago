<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0A2E5C">
<title>Bago City Explorer — Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS from CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" crossorigin="anonymous" />

<style>
/* ── Design Tokens ── */
:root {
  --navy: #0A2E5C;
  --navy-dark: #081f3d;
  --gold: #C9A227;
  --orange: #F28C28;
  --white: #FFFFFF;
  --bg-light: #F4F6F9;
  --text-primary: #172033;
  --text-secondary: #64748B;
  --text-tertiary: #94A3B8;
  --font-heading: 'Montserrat', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font-body)}
#map{position:fixed;inset:0;z-index:1}

/* ── Leaflet custom teardrop markers ── */
.custom-teardrop-marker {
  position: relative;
  background-color: #F28C28;
  width: 28px;
  height: 28px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
}

.custom-teardrop-marker.star {
  background: linear-gradient(135deg,#F28C28,#C9A227);
}

.custom-teardrop-marker.heritage {
  background: linear-gradient(135deg,#8e44ad,#9b59b6);
}

.custom-teardrop-marker.barangay {
  background: linear-gradient(135deg,#27ae60,#2ecc71);
}

.custom-teardrop-marker.city {
  background: linear-gradient(135deg,#0A2E5C,#0d3a73);
}

.custom-teardrop-marker .marker-icon {
  transform: rotate(45deg);
  font-size: 14px;
  line-height: 1;
}

/* Leaflet popup customization */
.leaflet-popup-content-wrapper {
  border-radius: 12px;
  font-family: var(--font-body);
}

.leaflet-popup-content {
  margin: 12px;
  min-width: 220px;
}

.popup-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 6px;
  font-family: var(--font-heading);
}

.popup-category {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  margin-bottom: 8px;
  text-transform: uppercase;
  font-family: var(--font-heading);
}

.popup-category.star {
  background: rgba(242,140,40,.2);
  color: #d97706;
}

.popup-category.heritage {
  background: rgba(142,68,173,.2);
  color: #8e44ad;
}

.popup-category.barangay {
  background: rgba(39,174,96,.2);
  color: #27ae60;
}

.popup-category.city {
  background: rgba(10,46,92,.2);
  color: #0A2E5C;
}

.popup-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}

.popup-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  background: linear-gradient(135deg,#0369a1,#0ea5e9);
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  transition: all .2s;
  font-family: var(--font-heading);
}

.popup-link:hover {
  background: linear-gradient(135deg,#0284c7,#06b6d4);
  transform: translateY(-1px);
}

/* ── Loader ── */
#ldr{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 50%,#0d3a73 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;transition:opacity .6s}
#ldr.done{opacity:0;pointer-events:none}
#ldr img{width:80px;height:80px;border-radius:50%;animation:lp 1.4s ease-in-out infinite;box-shadow:0 0 40px rgba(201,162,39,.6)}
@keyframes lp{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(5deg)}}
#ldr h2{font-size:20px;font-weight:900;color:var(--white);text-align:center;font-family:var(--font-heading)}
#ldr p{font-size:13px;color:rgba(255,255,255,.65);font-family:var(--font-body)}
.bw{width:200px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));animation:bfill 1.5s ease forwards}
@keyframes bfill{0%{width:0}100%{width:95%}}

/* ── Header ── */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,#0d3a73 100%);padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:1000;box-shadow:0 4px 24px rgba(10,46,92,.35)}
.bk{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;transition:all .2s;min-width:44px;min-height:44px}
.bk:hover{background:rgba(255,255,255,.25)}
.bk:active{transform:scale(.92)}
.hi{flex:1}.hi h1{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.3px;font-family:var(--font-heading)}.hi p{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:2px;font-family:var(--font-body)}
.hdr img{width:40px;height:40px;border-radius:50%;border:2px solid rgba(201,162,39,.6);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-badge{background:linear-gradient(135deg,rgba(201,162,39,.25),rgba(242,140,40,.25));backdrop-filter:blur(8px);border:1px solid rgba(201,162,39,.4);padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;color:rgba(255,255,255,.95);white-space:nowrap;font-family:var(--font-heading)}

/* ── Legend ── */
.legend{position:fixed;bottom:100px;left:14px;z-index:1000;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.18);font-size:10px;font-weight:600;color:var(--text-secondary);border:1px solid rgba(10,46,92,.08);font-family:var(--font-body)}
.legend-title{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:8px;font-family:var(--font-heading)}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.legend-row:last-child{margin-bottom:0}
.legend-dot{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);flex-shrink:0;border:2px solid var(--white);box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* ── Stats ── */
.stats{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 72px);right:14px;z-index:1000;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-radius:16px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.18);border:1px solid rgba(10,46,92,.08);text-align:center}
.stats-label{font-size:10px;color:var(--text-secondary);font-weight:600;font-family:var(--font-body);margin-bottom:4px}
.stats-value{font-size:24px;font-weight:900;color:var(--navy);font-family:var(--font-heading)}

/* ── FABs ── */
.fabs{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:1000;padding:0 14px;flex-wrap:wrap}
.fab{padding:12px 18px;border-radius:28px;border:none;cursor:pointer;font-size:12px;font-weight:800;color:var(--white);box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .2s;-webkit-tap-highlight-color:transparent;font-family:var(--font-heading);min-height:52px}
.fab:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.fab:active{transform:scale(.96)}
.freset{background:linear-gradient(135deg,var(--navy),#0d3a73);border:1px solid rgba(201,162,39,.3)}
.floc{background:linear-gradient(135deg,#3498db,#2980b9)}

/* Dark mode */
body.dark-mode{background:#0a0a0a}
body.dark-mode .legend{background:rgba(30,30,30,.98);border-color:#333}
body.dark-mode .legend-title{color:var(--white)}
body.dark-mode .legend-row{color:#aaa}
body.dark-mode .stats{background:rgba(30,30,30,.98);border-color:#333}
body.dark-mode .stats-label{color:#aaa}
body.dark-mode .stats-value{color:var(--white)}

@media (max-width: 640px) {
  .fabs {
    gap: 6px;
  }
  .fab {
    padding: 10px 14px;
    font-size: 11px;
    min-height: 44px;
  }
  .legend {
    bottom: 80px;
    left: 10px;
    padding: 10px 12px;
  }
  .stats {
    top: calc(max(12px,env(safe-area-inset-top)) + 68px);
    right: 10px;
    padding: 10px 12px;
  }
}
</style>
</head>
<body>
<div id="ldr">
  <img src="assets/images/bago-city-logo.png" alt="Bago City Logo">
  <h2>Bago City Explorer</h2>
  <p>Loading interactive map with all locations...</p>
  <div class="bw"><div class="bf"></div></div>
</div>

<div id="map"></div>

<div class="hdr">
  <a href="javascript:history.back()" class="bk" aria-label="Go back">&#8592;</a>
  <div class="hi">
    <h1>Bago City Explorer</h1>
    <p>Discover all 51 landmarks, barangays and attractions</p>
  </div>
  <span class="hdr-badge" id="spot-count">51 spots</span>
  <img src="assets/images/bago-city-logo.png" alt="Bago City">
</div>

<div class="legend" id="legend">
  <div class="legend-title">Map Legend</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,var(--orange),var(--gold))"></span> Tourist Attraction</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,#8e44ad,#9b59b6)"></span> Heritage Site</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,#27ae60,#2ecc71)"></span> Barangay</div>
  <div class="legend-row"><span class="legend-dot" style="background:linear-gradient(135deg,var(--navy),#0d3a73)"></span> City Service</div>
</div>

<div class="stats">
  <div class="stats-label">Total Locations</div>
  <div class="stats-value" id="total-count">51</div>
</div>

<div class="fabs">
  <button class="fab freset" id="btn-reset" onclick="resetMap()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    Reset Map
  </button>
  <button class="fab floc" id="btn-loc" onclick="locateUser()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    My Location
  </button>
</div>

<!-- Leaflet JS from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" crossorigin="anonymous"></script>

<script>
// Bago City data with verified coordinates and official bagocity.gov.ph descriptions
const BARANGAYS = [
  {name:"Abuanan",lng:122.98420025684727,lat:10.528539819452122,desc:"Formerly 'Numancia' after a Spanish town. In 1898, renamed Abuanan by Ambrosio Abuana. Once scattered families along Bago River with virgin forest.",landArea:"1,040.58 ha",distance:"21 km",puroks:12,type:"urban",tier:"barangay"},
  {name:"Alianza",lng:122.92403948142989,lat:10.471727207865271,desc:"Named 'Alianza' (alliance) by Spaniards when people fled colonial cruelty and formed alliance with outlaws for protection.",landArea:"365.87 ha",distance:"15 km",puroks:10,type:"rural",tier:"barangay"},
  {name:"Atipuluan",lng:122.94960955731095,lat:10.510806037719178,desc:"Once overran by vegetation, favorite of 'ati' bandits. Settlers fenced area with bamboo, organized 'rondas'. Name from 'ati' and 'puloy-an' (abode).",landArea:"916.89 ha",distance:"17.4 km",puroks:10,type:"urban",tier:"barangay"},
  {name:"Bacong",lng:123.04456895242693,lat:10.52549974342964,desc:"Largest barangay (4,827 ha). Named after 'bacong' plant with rhizome like giant onion, used to cure boils. Borders Murcia.",landArea:"4,827.04 ha",distance:"29.5 km",puroks:33,population:"9,245",type:"rural",tier:"barangay"},
  {name:"Bagroy",lng:122.87897208420888,lat:10.477054001912508,desc:"Named from 'mabagrong ulo' (head would sound) - punishment expression. Smallest population. Coastal along Guimaras Strait.",landArea:"399.86 ha",distance:"11 km",puroks:5,type:"rural",tier:"barangay"},
  {name:"Balingasag",lng:122.8439774832295,lat:10.532617670284175,desc:"Urban barangay with commercial establishments, 1.25 km from city center.",landArea:"436.84 ha",distance:"1.25 km",puroks:13,type:"urban",tier:"barangay"},
  {name:"Binubuhan",lng:123.00710623904017,lat:10.45741223258939,desc:"Name from 'bubu' (to pour) - priests performed baptism here using water from nearby clear river.",landArea:"2,152.72 ha",distance:"29.1 km",puroks:13,type:"rural",tier:"barangay"},
  {name:"Busay",lng:122.89328014830807,lat:10.537861484006031,desc:"Named 'Busay' (waterfalls) after falls at the river. Now disappeared due to river bank erosion.",landArea:"1,463.46 ha",distance:"7.2 km",puroks:20,type:"rural",tier:"barangay"},
  {name:"Calumangan",lng:122.88553878137543,lat:10.566696921406646,desc:"Spanish officials found place very muddy ('kalunangan') but mispronounced it as Calumangan.",landArea:"1,007.11 ha",distance:"6.4 km",puroks:22,type:"rural",tier:"barangay"},
  {name:"Caridad",lng:122.89319749672026,lat:10.490554449294747,desc:"Named after a hospitable woman who lived along main trail, offering refuge from heat and rain. Urban core barangay.",landArea:"553.44 ha",distance:"12 km",puroks:8,type:"urban",tier:"barangay"},
  {name:"Don Jorge L. Araneta",lng:122.94927723098942,lat:10.461494579318394,desc:"Named after Don Jorge Araneta, founder of Ma-ao Sugar Milling Company who spearheaded the sugar industry boom.",landArea:"2,143.98 ha",distance:"16.9 km",puroks:31,type:"urban",tier:"barangay"},
  {name:"Dulao",lng:122.96005550957621,lat:10.558628722037081,desc:"Named after 'Mandulao' tree whose bark cured soldiers' 'bulao' disease (yellow skin) during Spanish era.",landArea:"2,439.91 ha",distance:"17.8 km",puroks:20,type:"rural",tier:"barangay"},
  {name:"Ilijan",lng:123.0456139219644,lat:10.448583848724228,desc:"Farthest barangay (30.9 km). Once a forest with wild pigs, deer, imperial doves. Home to Buenos Aires Mountain Resort.",landArea:"1,488.49 ha",distance:"30.9 km",puroks:7,type:"rural",tier:"barangay"},
  {name:"Lag-asan",lng:122.84523382739843,lat:10.520407762342293,desc:"Important trading port where robbers got caught. 'Lag-asan' means 'place where people ran after another' in local dialect.",landArea:"436.34 ha",distance:"1.6 km",puroks:18,type:"rural",tier:"barangay"},
  {name:"Ma-ao",lng:122.99228504093716,lat:10.48782819895985,desc:"Most populous (17,975 as of 2020), most puroks (53). Named from 'mahao' - point where mountain people ate breakfast. Historic Ma-ao Sugar Central.",landArea:"3,938.33 ha",distance:"21.7 km",puroks:53,type:"tourist",tier:"barangay"},
  {name:"Mailum",lng:123.05063481981637,lat:10.469546480669388,desc:"Ecotourism at Mt. Kanlaon foothills. Name from misunderstood 'Indi kami ma itom, mailum-ilum lang' (We're not dusky, just brownish) told to Spaniards.",landArea:"3,283.61 ha",distance:"29.4 km",puroks:22,type:"tourist",tier:"barangay"},
  {name:"Malingin",lng:122.92411341066767,lat:10.51149786259714,desc:"From 'lingin' (dizzy) - two big whirlpools on Bago River: Malingin Daku and Malingin Diutay.",landArea:"1,409.01 ha",distance:"12.2 km",puroks:22,type:"rural",tier:"barangay"},
  {name:"Napoles",lng:122.89317526285295,lat:10.517984329175057,desc:"Dense forest hideout for fugitives in early 1800s who brought families here to elude authorities.",landArea:"1,279.42 ha",distance:"9.2 km",puroks:20,type:"rural",tier:"barangay"},
  {name:"Pacol",lng:122.85895949332998,lat:10.50141113020345,desc:"Named after large 'pacol' plants that dominated the area. Coastal barangay near city center.",landArea:"753.21 ha",distance:"7.5 km",puroks:8,type:"rural",tier:"barangay"},
  {name:"Poblacion",lng:122.83383286118658,lat:10.53607977456109,desc:"City center, seat of government. Smallest land area (311.5 ha). Home to Manuel Y. Torres Coliseum and Bantayan Park.",landArea:"311.50 ha",distance:"0 km",puroks:14,type:"tourist",tier:"barangay"},
  {name:"Sagasa",lng:122.89424548085672,lat:10.468489883021228,desc:"Named after 'sagasa' trees with dense shade where people converged to sell and trade. Once swampy and woody area. Coastal along Guimaras Strait.",landArea:"765.08 ha",distance:"12.2 km",puroks:12,type:"rural",tier:"barangay"},
  {name:"Sampinit",lng:122.8566256071049,lat:10.53815983453155,desc:"Part of pueblo known as Bago before 1898 revolution. First families lived in Sitio Pinanuy-an.",landArea:"419.92 ha",distance:"2.6 km",puroks:15,type:"rural",tier:"barangay"},
  {name:"Tabunan",lng:122.93794694969182,lat:10.570686757182422,desc:"Named after 'tabon' birds that came in great number. Once densely covered by tigbao and cogon grass, attracting hunters.",landArea:"1,263.57 ha",distance:"14.4 km",puroks:13,type:"rural",tier:"barangay"},
  {name:"Taloc",lng:122.90992379594812,lat:10.57849107881266,desc:"Massive immigration from Panay in 19th century due to sugar industry. 'Sacadas' stayed to clear forest and acquire land. Borders Bacolod City.",landArea:"1,575.95 ha",distance:"9.1 km",puroks:26,type:"urban",tier:"barangay"}
];

const ATTRACTIONS = [
  {name:"Pataan Mountain Resort",icon:"🏔",cat:"Mountain Resort",tier:"star",lng:123.09226372370247,lat:10.482019585201646,desc:"Mountain getaway near Kanlaon Volcano with cool breeze and panoramic views."},
  {name:"Kipot Twin Falls",icon:"💧",cat:"Waterfall",tier:"star",lng:123.06982716530145,lat:10.477862241175968,desc:"Twin waterfalls in Brgy. Mailum near Kipot Summer Resort — a refreshing natural destination at the foothills of Mt. Kanlaon."},
  {name:"Kipot Summer Resort",icon:"🏖",cat:"Resort",tier:"star",lng:123.06982716530145,lat:10.477862241175968,desc:"Popular summer resort near Kipot Twin Falls in Brgy. Mailum."},
  {name:"Buenos Aires Mountain Resort",icon:"⛰",cat:"Mountain Resort",tier:"star",lng:123.04815740062239,lat:10.457006377209883,desc:"Mountain resort offering scenic views and cool climate."},
  {name:"Maragandang Falls",icon:"💧",cat:"Waterfall",tier:"star",lng:123.07805561713836,lat:10.463949741247177,desc:"Beautiful waterfall in Bago City offering a refreshing natural experience."},
  {name:"Huganas Falls",icon:"💧",cat:"Waterfall",tier:"star",lng:123.07857060102316,lat:10.479226356766231,desc:"Scenic waterfall destination perfect for nature lovers and adventurers."},
  {name:"Gianna's Mountain Resort",icon:"🏔",cat:"Mountain Resort",tier:"star",lng:123.1038906544959,lat:10.485809417432602,desc:"Mountain resort with stunning views and relaxing atmosphere."},
  {name:"Torresta Infinity Farm",icon:"🌾",cat:"Farm Resort",tier:"star",lng:123.07419323556762,lat:10.48488104557143,desc:"Infinity farm resort offering scenic views and agricultural experience."},
  {name:"Bala-an Hills",icon:"⛰",cat:"Hills Resort",tier:"star",lng:123.10303538322907,lat:10.480267637780534,desc:"Hilltop destination with panoramic views of Bago City and surrounding areas."},
  {name:"Ma-ao Sugar Central",icon:"🏭",cat:"Heritage",tier:"heritage",lng:122.95384952618106,lat:10.475143262674598,desc:"Historic sugar mill central to Bago City's heritage."},
  {name:"Bago Public Market",icon:"🛒",cat:"Market",tier:"city",lng:122.83799043389978,lat:10.53936818360094,desc:"Main public market serving the city center."},
  {name:"Manuel Y. Torres Memorial Coliseum",icon:"🏟️",cat:"Sports",tier:"city",lng:122.83501322677576,lat:10.537226158958923,desc:"Major sports and events venue in Bago City."},
  {name:"Saint John the Baptist Parish",icon:"⛪",cat:"Religious",tier:"heritage",lng:122.83453506928456,lat:10.537283811975193,desc:"Historic parish church in the city center."},
  {name:"Balay ni Tan Juan",icon:"🏡",cat:"Heritage",tier:"heritage",lng:122.83477865897227,lat:10.534489844937438,desc:"Well-preserved ancestral house showcasing Bago City cultural heritage."},
  {name:"Javellana Mansion",icon:"🏰",cat:"Heritage",tier:"heritage",lng:122.83605744838584,lat:10.536859752555511,desc:"Built in 1920 on a 440-ha sugar plantation. Also known as Balay Daku."},
  {name:"Bantayan Park",icon:"🌳",cat:"Heritage Park",tier:"star",lng:122.83162155649741,lat:10.537627445468019,desc:"Historic park — site of the November 5, 1898 revolution led by Gen. Juan Araneta."},
  {name:"General Juan Anacleto Monument",icon:"🗿",cat:"Monument",tier:"heritage",lng:122.83588048964978,lat:10.537519695817458,desc:"Monument honoring General Juan Anacleto, a key figure in Bago City's revolutionary history."},
  {name:"Ma-ao Public Plaza",icon:"🏛️",cat:"Public Space",tier:"city",lng:122.99161502666759,lat:10.489965324482274,desc:"Public plaza in the Ma-ao area."},
  {name:"Bago City Hall",icon:"🏛️",cat:"Government",tier:"city",lng:122.83512455511269,lat:10.53815531116121,desc:"Seat of the local government of Bago City."}
];

// Combine all locations
const ALL_LOCATIONS = [...BARANGAYS, ...ATTRACTIONS];

// Initialize map centered on Bago City
const map = L.map('map', {
  center: [10.5380, 122.8424],
  zoom: 12,
  zoomControl: false
});

// Add tile layer (OpenStreetMap)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// Add zoom control to bottom right
L.control.zoom({
  position: 'bottomright'
}).addTo(map);

// Create marker cluster group
const markers = L.markerClusterGroup({
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let className = 'marker-cluster marker-cluster-';
    
    // Color based on cluster size
    if (count < 10) {
      className += 'small';
    } else if (count < 20) {
      className += 'medium';
    } else {
      className += 'large';
    }
    
    return L.divIcon({
      html: '<div style="background:#F28C28;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.4);">' + count + '</div>',
      className: 'custom-cluster-icon',
      iconSize: L.point(40, 40, true)
    });
  }
});

// Create custom teardrop icon
function createTearDropIcon(tier, icon) {
  const tierClass = tier || 'city';
  const displayIcon = icon || '📍';
  
  return L.divIcon({
    className: 'custom-marker',
    html: `
      <div class="custom-teardrop-marker ${tierClass}">
        <div class="marker-icon">${displayIcon}</div>
      </div>
    `,
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -28]
  });
}

// Add all markers
ALL_LOCATIONS.forEach(location => {
  const tier = location.tier || 'city';
  const icon = location.icon || '📍';
  
  const marker = L.marker([location.lat, location.lng], {
    icon: createTearDropIcon(tier, icon)
  });
  
  // Create popup content with enhanced barangay data
  let popupContent = `
    <div class="popup-title">${location.name}</div>
    <span class="popup-category ${tier}">${location.cat || 'Barangay'}</span>
    <div class="popup-desc">${location.desc}</div>
  `;
  
  // Add barangay statistics if available
  if (location.landArea || location.distance || location.puroks) {
    popupContent += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:12px;color:#666;">';
    if (location.landArea) popupContent += `<div>📏 Land Area: ${location.landArea}</div>`;
    if (location.distance) popupContent += `<div>📍 Distance: ${location.distance} from city center</div>`;
    if (location.puroks) popupContent += `<div>🏘️ Puroks: ${location.puroks}</div>`;
    if (location.population) popupContent += `<div>👥 Population: ${location.population}</div>`;
    popupContent += '</div>';
  }
  
  marker.bindPopup(popupContent, {
    maxWidth: 280,
    className: 'custom-popup'
  });
  
  markers.addLayer(marker);
});

// Add marker cluster to map
map.addLayer(markers);

// Update total count
document.getElementById('total-count').textContent = ALL_LOCATIONS.length;
document.getElementById('spot-count').textContent = ALL_LOCATIONS.length + ' spots';

// Hide loader after map loads
setTimeout(() => {
  const ldr = document.getElementById('ldr');
  ldr.classList.add('done');
  setTimeout(() => ldr.style.display = 'none', 600);
}, 1000);

// Reset map function
function resetMap() {
  map.setView([10.5380, 122.8424], 12);
}

// Locate user function
function locateUser() {
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser');
    return;
  }
  
  const btn = document.getElementById('btn-loc');
  btn.innerHTML = '🔄 Locating...';
  btn.disabled = true;
  
  navigator.geolocation.getCurrentPosition(
    position => {
      const { latitude, longitude } = position.coords;
      
      // Add user marker
      L.marker([latitude, longitude], {
        icon: L.divIcon({
          className: 'custom-marker',
          html: '<div style="background:#3498db;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.4);"></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map)
        .bindPopup('📍 You are here')
        .openPopup();
      
      // Fly to user location
      map.setView([latitude, longitude], 15);
      
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> My Location';
      btn.disabled = false;
    },
    error => {
      let msg = 'Unable to retrieve your location';
      switch (error.code) {
        case error.PERMISSION_DENIED:
          msg = 'Location access denied. Please enable location services.';
          break;
        case error.POSITION_UNAVAILABLE:
          msg = 'Location information is unavailable.';
          break;
        case error.TIMEOUT:
          msg = 'Location request timed out.';
          break;
      }
      alert(msg);
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> My Location';
      btn.disabled = false;
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
</script>
</body>
</html>
